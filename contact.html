<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact form for Civic Parts Depot." />
    <meta name="keywords" content="contact, support, civic parts" />
    <title>Contact | COMP3340 Civic Parts Depot</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="light-theme">
    <header class="site-header">
      <div>
        <h1>Contact Us</h1>
        <p class="subtitle">Dynamic Form Page 1</p>
      </div>
      <div class="theme-box">
        <label for="themeSelect">Theme:</label>
        <select id="themeSelect">
          <option value="light-theme">Light</option>
          <option value="dark-theme">Dark</option>
          <option value="blue-theme">Blue</option>
        </select>
      </div>
    </header>
    <nav class="main-menu" aria-label="Main menu">
      <a href="index.html">Home</a><a href="about.html">About</a
      ><a href="catalog.html">Catalog</a><a href="contact.html">Contact</a
      ><a href="converter.html">Currency</a
      ><a href="help-getting-started.html">Help Wiki</a>
    </nav>
    <main>
      <section class="panel">
        <form id="contactForm">
          <input type="text" name="name" placeholder="Your name" required />
          <input type="email" name="email" placeholder="Your email" required />
          <textarea
            name="message"
            rows="4"
            placeholder="Your message"
            required
          ></textarea>
          <button type="submit">Send</button>
        </form>
        <p id="contactResult"></p>
      </section>
    </main>
    <footer><p id="weatherText">Current Windsor Weather: Loading...</p></footer>
    <script src="script.js"></script>
  </body>
</html>
