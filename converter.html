<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="USD to CAD converter for parts pricing."
    />
    <meta name="keywords" content="currency converter, usd cad, civic parts" />
    <title>Currency Converter | COMP3340 Civic Parts Depot</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="light-theme">
    <header class="site-header">
      <div>
        <h1>Currency Converter</h1>
        <p class="subtitle">Dynamic Form Page 2</p>
      </div>
      <div class="theme-box">
        <label for="themeSelect">Theme:</label>
        <select id="themeSelect">
          <option value="light-theme">Light</option>
          <option value="dark-theme">Dark</option>
          <option value="blue-theme">Blue</option>
        </select>
      </div>
    </header>
    <nav class="main-menu" aria-label="Main menu">
      <a href="index.html">Home</a><a href="about.html">About</a
      ><a href="catalog.html">Catalog</a><a href="contact.html">Contact</a
      ><a href="converter.html">Currency</a
      ><a href="help-getting-started.html">Help Wiki</a>
    </nav>
    <main>
      <section class="panel">
        <form id="currencyForm">
          <input
            type="number"
            id="usdAmount"
            min="0"
            step="0.01"
            placeholder="USD amount"
            required
          />
          <button type="submit">Convert</button>
        </form>
        <p id="currencyResult"></p>
      </section>
    </main>
    <footer><p id="weatherText">Current Windsor Weather: Loading...</p></footer>
    <script src="script.js"></script>
  </body>
</html>
